<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cute NGL World ✨</title>
    <!-- Lightweight Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        html {
            scroll-behavior: smooth;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
        }

        /* Full page background using your uploaded image */
        body {
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #1e1b4b;
        }

        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(15, 10, 30, 0.35);
        }

        h1 {
            font-family: 'Comfortaa', cursive;
            font-size: 2.8em;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 4px 12px rgba(99, 102, 241, 0.8);
        }

        p.subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #e0e7ff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .btn-start {
            background-color: #a5b4fc;
            color: #1e1b4b;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 1.2em;
            font-family: 'Comfortaa', cursive;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(165, 180, 252, 0.6);
            transition: transform 0.1s ease, background-color 0.2s;
            display: inline-block;
        }

        .btn-start:active {
            transform: scale(0.96);
        }

        .app-section {
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            background: rgba(15, 10, 30, 0.45);
            backdrop-filter: blur(5px);
        }

        .container {
            max-width: 450px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
            margin-bottom: 25px;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .avatar {
            width: 70px;
            height: 70px;
            background-color: #818cf8;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        h2 {
            font-family: 'Comfortaa', cursive;
            color: #4338ca;
            margin: 0 0 10px 0;
            font-size: 22px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #c7d2fe;
            border-radius: 18px;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            outline: none;
            resize: none;
            background-color: #ffffff;
            margin-bottom: 15px;
        }

        textarea:focus {
            border-color: #6366f1;
        }

        .btn-send {
            width: 100%;
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Comfortaa', cursive;
            transition: 0.1s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-send:active {
            transform: scale(0.98);
        }

        .inbox-title {
            font-family: 'Comfortaa', cursive;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .message-bubble {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 18px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-left: 6px solid #6366f1;
        }

        .message-time {
            font-size: 11px;
            color: #6366f1;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .message-text {
            color: #334155;
            line-height: 1.5;
            margin: 0;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Welcome to My World! ✨</h1>
        <p class="subtitle">A cozy space for stars, thoughts, and secret notes 🌙</p>
        <a href="#ngl-box" class="btn-start">Get Started 🚀</a>
    </div>

    <div class="app-section" id="ngl-box">
        <div class="container">
            <div class="card">
                <div class="avatar">💌</div>
                <h2>@sheemaywarin</h2>
                <p style="color: #4f46e5; font-weight: bold;">send me anonymous messages!</p>

                <textarea id="msgInput" rows="4" placeholder="send me a secret note or question..."></textarea>
                <button class="btn-send" onclick="sendMessage()">Send Anonymously 🚀</button>
            </div>

            <h3 class="inbox-title">📥 Received Notes</h3>
            <div id="inbox"></div>
        </div>
    </div>

    <script>
        function sendMessage() {
            var input = document.getElementById("msgInput");
            var text = input.value.trim();

            if (text === "") {
                alert("Please type a message first! 💜");
                return;
            }

            var inbox = document.getElementById("inbox");
            var newMsg = document.createElement("div");
            newMsg.className = "message-bubble";
            newMsg.innerHTML = `
                <div class="message-time">Anonymous • Just now</div>
                <p class="message-text">${escapeHtml(text)}</p>
            `;

            inbox.insertBefore(newMsg, inbox.firstChild);
            input.value = "";
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>

</body>
</html>
